name: Publish

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the existing registry version without publishing
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !inputs.verify_only }}
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Validate release tag and select npm channel
        id: release
        run: node scripts/release-preflight.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack and verify the release archive
        id: package
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          filename=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/pack.json'))[0].filename")
          archive="$RUNNER_TEMP/$filename"
          node scripts/check-release-package.mjs "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish the verified archive
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$RELEASE_ARCHIVE" --provenance --access public --registry https://registry.npmjs.org/ --tag "$NPM_DIST_TAG"

      - name: Verify the published registry package
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/check-release-package.mjs "shell-sdk@$version"

  verify:
    name: Verify existing npm package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the published registry package
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/check-release-package.mjs "shell-sdk@$version"
